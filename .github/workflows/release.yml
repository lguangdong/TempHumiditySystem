name: Release

# 仅在推送形如 v1.0.0 的版本标签时触发（不做 push/PR 的常规 CI）
on:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

# 同一标签被重复触发时串行执行，避免并发创建 Release 互相踩踏
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT: TempHumiditySystem/TempHumiditySystem.csproj
  APP_NAME: TempHumiditySystem
  RUNTIME_ID: win-x64
  # 输出到已被 .gitignore 忽略的 bin/ 下，避免污染仓库工作区
  PUBLISH_DIR: bin/publish

jobs:
  release:
    name: 构建并发布（win-x64 自包含单文件）
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码（全量历史，供 Release Notes 生成）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: dotnet restore "${{ env.PROJECT }}" -r ${{ env.RUNTIME_ID }}

      # 独立依赖（依赖模式 = 独立 / self-contained）+ 单文件：
      # - IncludeNativeLibrariesForSelfExtract：把 libSkiaSharp.dll、wpfgfx_cor3.dll 等原生库一并内嵌，
      #   否则它们会散落在 exe 旁边，就不是"单个文件"了
      # - DebugType=none：不产出 .pdb，确保输出目录只剩一个 exe
      # - PublishTrimmed=false：WPF 不支持裁剪，开启会因 XAML/反射被裁掉而在运行期崩溃
      # - EnableCompressionInSingleFile：体积约减半（代价是首次启动解压稍慢）
      - name: 发布（自包含 + 单文件）
        run: >
          dotnet publish "${{ env.PROJECT }}"
          -c Release
          -r ${{ env.RUNTIME_ID }}
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -p:DebugType=none
          -p:DebugSymbols=false
          -o ${{ env.PUBLISH_DIR }}

      - name: 校验产物必须为单个 exe
        shell: pwsh
        run: |
          $dir = '${{ env.PUBLISH_DIR }}'
          $exeName = '${{ env.APP_NAME }}.exe'
          $exe = Join-Path $dir $exeName

          if (-not (Test-Path $exe)) {
            Write-Error "发布失败：未找到 $exe"
            exit 1
          }

          $files = @(Get-ChildItem -Path $dir -File -Recurse)
          Write-Host "发布目录 $dir 内容："
          $files | ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name) }

          $extra = @($files | Where-Object { $_.Name -ne $exeName })
          if ($extra.Count -gt 0) {
            Write-Error ("发布目录存在额外文件，未做到单文件：" + ($extra.Name -join ', '))
            exit 1
          }

          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "单文件校验通过：$exeName（$sizeMb MB）"

          @(
            '### 发布产物'
            ''
            ('- 文件：`{0}`' -f $exeName)
            ('- 大小：{0} MB' -f $sizeMb)
            ('- 平台：{0}（自包含单文件，目标机无需安装 .NET 运行时）' -f '${{ env.RUNTIME_ID }}')
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 重命名产物（带版本与架构）
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $src = Join-Path '${{ env.PUBLISH_DIR }}' '${{ env.APP_NAME }}.exe'
          $assetName = '${{ env.APP_NAME }}-' + $tag + '-${{ env.RUNTIME_ID }}.exe'
          $assetPath = Join-Path '${{ env.PUBLISH_DIR }}' $assetName
          Move-Item -Path $src -Destination $assetPath -Force

          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV
          Write-Host "发布资产：$assetName"

      - name: 创建 GitHub Release 并上传资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag $env:ASSET_PATH --title $tag --generate-notes --verify-tag
          Write-Host "已创建 Release $tag，资产：$env:ASSET_NAME"
